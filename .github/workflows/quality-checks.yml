name: Quality Checks

on:
  pull_request:
  push:
    branches: [main]
    paths-ignore:
      - 'README.md'
      - 'env.example'
      - '.vscode/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_ENV: development
  HUSKY: 0

jobs:
  install:
    name: Install Dependencies
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: 'pnpm'

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

  quality:
    needs: install
    name: Code Quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: 'pnpm'

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Test the audit gate
        run: scripts/pnpm-audit.test.sh

      # GHSA-fc5q-39xc-vjpf: picomatch ReDoS with no patched release (https://github.com/advisories/GHSA-fc5q-39xc-vjpf).
      # Ignored until 2026-12-01, or until picomatch ships a release past 4.0.7, whichever comes first.
      # Holds only while no code passes user-supplied strings to picomatch/micromatch/globby as patterns.
      # Upstream fixes: https://github.com/micromatch/picomatch/pull/254, https://github.com/micromatch/picomatch/pull/246,
      # https://github.com/micromatch/picomatch/pull/194
      - name: Audit Dependencies
        env:
          PNPM_AUDIT_LEVEL: high
        run: scripts/pnpm-audit.sh GHSA-fc5q-39xc-vjpf=2026-12-01

      - name: Run Type Check
        run: pnpm run typecheck

      - name: Run ESLint
        run: pnpm run lint

      - name: Run Prettier Check
        run: pnpm run format:check

      - name: Run Markdown Lint Check
        run: pnpm run lint:md

  build:
    needs: quality
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: 'pnpm'

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Build
        run: pnpm run build
        env:
          ASTRO_TELEMETRY_DISABLED: 1

  status-check:
    needs: [install, quality, build]
    name: Final Status Check
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Check Workflow Status
        run: |
          if [[ "${{ contains(needs.*.result, 'failure') }}" == "true" ]]; then
            echo "❌ Workflow failed because one or more jobs failed"
            exit 1
          elif [[ "${{ contains(needs.*.result, 'cancelled') }}" == "true" ]]; then
            echo "⚠️ Workflow cancelled because one or more jobs were cancelled"
            exit 1
          else
            echo "✅ All jobs completed successfully"
          fi
